<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinfonia das Gemas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1 id="titulo-main">Sinfonia das Gemas</h1>
    <p id="subtitulo-main" class="sr-only"></p>

    <div class="creditos-panel">
        <span id="txt-desenvolvido">Desenvolvido por</span> 
        <a href="https://github.com/concego" target="_blank">Anderson Carvalho</a> | 
        <span id="txt-feedback">Feedback para:</span> 
        <a href="mailto:euconcego@gmail.com">euconcego@gmail.com</a>
    </div>

    <!-- Interface do Jogo -->
    <div id="tela-idioma" class="tela-fluxo">
        <button id="btn-pt-br" class="btn-fluxo" onclick="selecionarIdioma('pt-BR')">Português (Brasil)</button>
        <button id="btn-en-us" class="btn-fluxo" onclick="selecionarIdioma('en-US')">English (US)</button>
    </div>

    <div id="tela-inicial" class="tela-fluxo" style="display:none;">
        <div class="menu-nivel-block">
            <label id="lbl-dificuldade" for="select-dificuldade">Dificuldade:</label>
            <select id="select-dificuldade" class="seletor-nivel">
                <option value="facil">Fácil</option>
                <option value="medio">Médio</option>
                <option value="dificil">Difícil</option>
            </select>
        </div>
        <div class="menu-nivel-block">
            <label id="lbl-selecao" for="select-nivel">Escolha o nível:</label>
            <select id="select-nivel" class="seletor-nivel"></select>
        </div>
        <button id="btn-comecar" class="btn-fluxo">Iniciar Partida</button>
        <button id="btn-idioma-menu" class="btn-fluxo secundario">Trocar Idioma</button>
        <button id="bt-abrir-ajuda" class="btn-fluxo secundario">Como Jogar</button>
    </div>

    <div id="container-jogo">
        <div class="painel-status">
            <div id="status-fase" class="status-item">Nível 1</div>
            <div id="status-desafio" class="status-item" style="color: #ffcc00; font-weight: bold;"></div>
            <div class="status-item">
                <span id="label-pontos">Pontos</span>: <span id="pontos-atual" class="status-destaque">0</span> / <span id="pontos-meta">300</span>
            </div>
            <div id="status-vidas" class="status-item">Vidas: 5</div>
        </div>

        <div id="tabuleiro"></div>
        <button id="btn-abandonar" class="btn-fluxo secundario">Sair do Jogo</button>
    </div>

    <!-- Telas de Fim de Jogo -->
    <div id="tela-vitoria" class="tela-fluxo" style="display:none;">
        <h2 id="vitoria-titulo">Nível Concluído!</h2>
        <p id="vitoria-resumo">Você atingiu a meta.</p>
        <button id="btn-proximo-nivel" class="btn-fluxo">Avançar</button>
        <button id="btn-vitoria-menu" class="btn-fluxo secundario">Menu Principal</button>
    </div>

    <div id="tela-gameover" class="tela-fluxo" style="display:none;">
        <h2 id="gameover-titulo">Fim de Jogo!</h2>
        <p id="gameover-resumo">Suas vidas acabaram.</p>
        <button id="btn-tentar-novamente" class="btn-fluxo">Tentar Novamente</button>
        <button id="btn-gameover-menu" class="btn-fluxo secundario">Menu Principal</button>
    </div>

    <!-- Modal de Ajuda -->
    <div id="modal-ajuda">
        <div class="modal-conteudo">
            <h2 id="titulo-ajuda">Como Jogar</h2>
            <p id="ajuda-p1"></p>
            <ul id="lista-ajuda"></ul>
            <button id="bt-fechar-ajuda" class="btn-fluxo">Fechar</button>
        </div>
    </div>

    <div id="anunciador-braille" class="sr-only" aria-live="polite"></div>

    <script src="script/script.js"></script>
</body>
</html>
