<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinfonia das Gemas</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        h1 { color: #00ffcc; margin: 10px 0; text-align: center; }
        .creditos-panel { font-size: 0.9rem; color: #aaa; margin-bottom: 20px; text-align: center; }
        .creditos-panel a { color: #bb86fc; text-decoration: none; font-weight: bold; }
        .tela-fluxo { display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #1e1e1e; padding: 25px; border-radius: 8px; width: 100%; max-width: 500px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: center; margin-top: 15px; }
        .btn-fluxo { background-color: #00ffcc; color: #121212; border: none; padding: 12px 24px; font-size: 1.1rem; font-weight: bold; border-radius: 6px; cursor: pointer; margin: 8px 0; width: 100%; }
        .btn-fluxo.secundario { background-color: #333333; color: #00ffcc; border: 2px solid #00ffcc; }
        .menu-nivel-block { margin: 15px 0; width: 100%; display: flex; flex-direction: column; gap: 6px; text-align: left; }
        .seletor-nivel { width: 100%; padding: 10px; border-radius: 4px; background: #2a2a2a; color: white; border: 1px solid #444; font-size: 1rem; }
        #container-jogo { display: none; width: 100%; max-width: 600px; flex-direction: column; gap: 15px; }
        .painel-status { background: #1e1e1e; padding: 15px; border-radius: 8px; border-left: 5px solid #00ffcc; }
        .status-destaque { color: #00ffcc; font-weight: bold; font-size: 1.3rem; }
        #tabuleiro-container { width: 100%; aspect-ratio: 1/1; background: #333; padding: 4px; border-radius: 8px; }
        .tabela-gemas { width: 100%; height: 100%; border-collapse: collapse; table-layout: fixed; }
        .tabela-gemas td { padding: 2px; }
        .gema { width: 100%; height: 100%; border: none; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; background-color: #222; outline: none; }
        .gema img { width: 80%; height: 80%; object-fit: contain; pointer-events: none; }
        .gema:focus { outline: 4px solid #ffffff; z-index: 10; transform: scale(1.05); }
        .gema.selecionada { outline: 4px solid #00ffcc; animation: pulse 1s infinite alternate; }
        @keyframes pulse { from { box-shadow: 0 0 5px #00ffcc; } to { box-shadow: 0 0 20px #00ffcc; } }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }
        #modal-ajuda { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; }
        .modal-conteudo { background: #1e1e1e; padding: 25px; border-radius: 12px; max-width: 500px; border: 2px solid #00ffcc; }
    </style>
</head>
<body>
    <main id="tela-idioma" class="tela-fluxo">
        <h1>Sinfonia das Gemas</h1>
        <button class="btn-fluxo" onclick="selecionarIdioma('pt-BR')">Português (Brasil)</button>
        <button class="btn-fluxo" onclick="selecionarIdioma('en-US')">English</button>
    </main>
    <main id="tela-inicial" class="tela-fluxo" style="display: none;">
        <h1 id="titulo-main">Sinfonia das Gemas</h1>
        <div class="creditos-panel">
            <span id="txt-desenvolvido">Desenvolvido por</span> <strong>Anderson Carvalho</strong><br>
            <a href="mailto:euconcego@gmail.com">euconcego@gmail.com</a>
        </div>
        <div class="menu-nivel-block">
            <label id="lbl-dificuldade" for="select-dificuldade">Dificuldade:</label>
            <select id="select-dificuldade" class="seletor-nivel">
                <option value="facil">Fácil</option>
                <option value="medio">Médio</option>
                <option value="dificil">Difícil</option>
            </select>
        </div>
        <div class="menu-nivel-block">
            <label id="lbl-selecao" for="select-nivel">Nível:</label>
            <select id="select-nivel" class="seletor-nivel"></select>
        </div>
        <button class="btn-fluxo" id="btn-comecar">Iniciar</button>
        <button class="btn-fluxo secundario" id="bt-abrir-ajuda">Como Jogar</button>
    </main>
    <section id="container-jogo">
        <div class="painel-status" role="status">
            <div id="status-fase">Nível 1</div>
            <div id="status-desafio"></div>
            <div><span id="label-pontos">Pontos</span>: <span id="pontos-atual" class="status-destaque">0</span> / <span id="pontos-meta">200</span></div>
            <div id="status-vidas">Vidas: 5</div>
        </div>
        <div id="tabuleiro-container">
            <table class="tabela-gemas" id="tabuleiro" role="grid" aria-label="Tabuleiro de gemas"></table>
        </div>
        <button class="btn-fluxo secundario" id="btn-abandonar">Sair</button>
    </section>
    <section id="tela-vitoria" class="tela-fluxo" style="display: none;">
        <h1 id="vitoria-titulo">Concluído!</h1>
        <button class="btn-fluxo" id="btn-proximo-nivel">Próximo</button>
        <button class="btn-fluxo secundario" onclick="voltarAoMenu()">Menu</button>
    </section>
    <section id="tela-gameover" class="tela-fluxo" style="display: none;">
        <h1 id="gameover-titulo">Fim de Jogo!</h1>
        <button class="btn-fluxo" onclick="iniciarPartida()">Tentar Novamente</button>
        <button class="btn-fluxo secundario" onclick="voltarAoMenu()">Menu</button>
    </section>
    <div id="modal-ajuda" role="dialog" aria-modal="true">
        <div class="modal-conteudo">
            <h2 id="titulo-ajuda">Como Jogar</h2>
            <ul id="lista-ajuda" style="text-align: left; margin: 15px 0;"></ul>
            <button class="btn-fluxo" onclick="document.getElementById('modal-ajuda').style.display='none'">Fechar</button>
        </div>
    </div>
    <div id="anunciador-braille" class="sr-only" aria-live="assertive"></div>
    <script>
        let idiomaAtual = 'pt-BR';
        const TEXTOS = {
            'pt-BR': {
                titulo: "Sinfonia das Gemas", creditos: "Desenvolvido por", 
                optFacil: "Fácil (Mais vidas)", optMedio: "Médio", optDificil: "Difícil",
                btnIniciar: "Iniciar Partida", btnAjuda: "Como Jogar",
                vitoriaTitulo: "Nível Concluído!", gameoverTitulo: "Fim de Jogo!",
                ajudaItems: ["Navegue com setas ou arraste o dedo (móvel).", "Selecione com Enter/Espaço.", "Movimentos inválidos custam vida."],
                statusNivel: "Nível", statusPontos: "Pontos", statusVidas: "Vidas",
                gemas: ["Rubi", "Safira", "Esmeralda", "Ônix", "Topázio", "Diamante"]
            },
            'en-US': {
                titulo: "Gems Symphony", creditos: "Developed by", 
                optFacil: "Easy", optMedio: "Medium", optDificil: "Hard",
                btnIniciar: "Start", btnAjuda: "How to Play",
                vitoriaTitulo: "Level Completed!", gameoverTitulo: "Game Over!",
                ajudaItems: ["Navigate with arrows or swipe (mobile).", "Select with Enter/Space.", "Invalid moves cost life."],
                statusNivel: "Level", statusPontos: "Points", statusVidas: "Lives",
                gemas: ["Ruby", "Sapphire", "Emerald", "Onyx", "Topaz", "Diamond"]
            }
        };
        const CONFIG_NIVEIS = [
            { nivel: 1, tamanho: 4, meta: 300, tipos: 4 },
            { nivel: 2, tamanho: 6, meta: 400, tipos: 4 },
            { nivel: 3, tamanho: 7, meta: 600, tipos: 5 },
            { nivel: 4, tamanho: 7, meta: 800, tipos: 5 },
            { nivel: 5, tamanho: 8, meta: 1000, tipos: 6 }
        ];
        const GEMAS = [
            { id: 0, nota: 261.63, img: "assets/ruby.png" },
            { id: 1, nota: 293.66, img: "assets/sapphire.png" },
            { id: 2, nota: 329.63, img: "assets/emerald.png" },
            { id: 3, nota: 349.23, img: "assets/onyx.png" },
            { id: 4, nota: 392.00, img: "assets/topaz.png" },
            { id: 5, nota: 440.00, img: "assets/diamond.png" }
        ];
        let nivelIdx = 0, dificuldade = "facil", pontuacao = 0, vidas = 5, joiaBonusId = -1, matrizGemas = [], gemaSelecionada = null, jogoAtivo = false, bloqueado = false, audioCtx = null;
        let coordFocada = { l: 0, c: 0 };
        function selecionarIdioma(lang) {
            idiomaAtual = lang;
            document.getElementById('tela-idioma').style.display = 'none';
            document.getElementById('tela-inicial').style.display = 'flex';
            atualizarTextos();
        }
        function atualizarTextos() {
            const t = TEXTOS[idiomaAtual];
            document.getElementById('titulo-main').innerText = t.titulo;
            document.getElementById('btn-comecar').innerText = t.btnIniciar;
            document.getElementById('bt-abrir-ajuda').innerText = t.btnAjuda;
            const selNivel = document.getElementById('select-nivel');
            selNivel.innerHTML = "";
            CONFIG_NIVEIS.forEach((c, i) => {
                const opt = document.createElement('option'); opt.value = i; opt.text = `${t.statusNivel} ${c.nivel}`;
                selNivel.appendChild(opt);
            });
            const listaAjuda = document.getElementById('lista-ajuda');
            listaAjuda.innerHTML = "";
            t.ajudaItems.forEach(item => { const li = document.createElement('li'); li.innerText = item; listaAjuda.appendChild(li); });
        }
        function iniciarPartida() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            nivelIdx = parseInt(document.getElementById('select-nivel').value);
            dificuldade = document.getElementById('select-dificuldade').value;
            pontuacao = 0; vidas = 5; jogoAtivo = true; coordFocada = { l: 0, c: 0 };
            document.getElementById('tela-inicial').style.display = 'none';
            document.getElementById('container-jogo').style.display = 'flex';
            document.getElementById('tela-vitoria').style.display = 'none';
            document.getElementById('tela-gameover').style.display = 'none';
            gerarTabuleiro(); atualizarInterface();
            setTimeout(() => { const f = document.querySelector('.gema[tabindex="0"]'); if(f) f.focus(); }, 100);
        }
        function gerarTabuleiro() {
            const config = CONFIG_NIVEIS[nivelIdx]; matrizGemas = [];
            for (let l = 0; l < config.tamanho; l++) {
                matrizGemas[l] = [];
                for (let c = 0; c < config.tamanho; c++) {
                    let id; do { id = Math.floor(Math.random() * config.tipos); } while (seriaMatch(l, c, id));
                    matrizGemas[l][c] = id;
                }
            }
            renderizarTabuleiro();
        }
        function seriaMatch(l, c, id) {
            if (c >= 2 && matrizGemas[l][c-1] === id && matrizGemas[l][c-2] === id) return true;
            if (l >= 2 && matrizGemas[l-1][c] === id && matrizGemas[l-2][c] === id) return true;
            return false;
        }
        function renderizarTabuleiro() {
            const config = CONFIG_NIVEIS[nivelIdx];
            const tab = document.getElementById('tabuleiro');
            tab.innerHTML = "";
            for (let l = 0; l < config.tamanho; l++) {
                const tr = document.createElement('tr');
                for (let c = 0; c < config.tamanho; c++) {
                    const td = document.createElement('td');
                    const id = matrizGemas[l][c];
                    const gema = document.createElement('button');
                    gema.className = 'gema';
                    gema.id = `gema-${l}-${c}`;
                    gema.tabIndex = (l === coordFocada.l && c === coordFocada.c) ? 0 : -1;
                    if (id !== -1) {
                        const img = document.createElement('img'); img.src = GEMAS[id].img; img.alt = ""; gema.appendChild(img);
                        const coord = String.fromCharCode(65 + c) + (l + 1);
                        gema.setAttribute('aria-label', `${coord}: ${TEXTOS[idiomaAtual].gemas[id]}`);
                    }
                    gema.onclick = () => clicarGema(l, c);
                    gema.onkeydown = (e) => tratarTeclado(e, l, c);
                    td.appendChild(gema); tr.appendChild(td);
                }
                tab.appendChild(tr);
            }
        }
        function clicarGema(l, c) {
            if (bloqueado || !jogoAtivo) return;
            tocarSom(GEMAS[matrizGemas[l][c]].nota);
            const gemaDOM = document.getElementById(`gema-${l}-${c}`);
            if (!gemaSelecionada) {
                gemaSelecionada = { l, c, dom: gemaDOM };
                gemaDOM.classList.add('selecionada');
            } else {
                const dist = Math.abs(l - gemaSelecionada.l) + Math.abs(c - gemaSelecionada.c);
                if (dist === 1) trocar(gemaSelecionada.l, gemaSelecionada.c, l, c);
                gemaSelecionada.dom.classList.remove('selecionada');
                gemaSelecionada = null;
            }
        }
        function trocar(l1, c1, l2, c2) {
            bloqueado = true;
            const temp = matrizGemas[l1][c1];
            matrizGemas[l1][c1] = matrizGemas[l2][c2];
            matrizGemas[l2][c2] = temp;
            renderizarTabuleiro();
            setTimeout(() => {
                if (checarMatches()) { processarTurno(); }
                else {
                    matrizGemas[l2][c2] = matrizGemas[l1][c1]; matrizGemas[l1][c1] = temp;
                    vidas--; tocarErro(); renderizarTabuleiro(); atualizarInterface();
                    if (vidas <= 0) fimDeJogo(false);
                    bloqueado = false;
                }
            }, 300);
        }
        function checarMatches() {
            const config = CONFIG_NIVEIS[nivelIdx];
            let encontrou = false;
            let paraEliminar = Array.from({ length: config.tamanho }, () => Array(config.tamanho).fill(false));
            for (let l = 0; l < config.tamanho; l++) {
                for (let c = 0; c < config.tamanho - 2; c++) {
                    let id = matrizGemas[l][c];
                    if (id !== -1 && id === matrizGemas[l][c+1] && id === matrizGemas[l][c+2]) {
                        paraEliminar[l][c] = paraEliminar[l][c+1] = paraEliminar[l][c+2] = true;
                        encontrou = true;
                    }
                }
            }
            for (let c = 0; c < config.tamanho; c++) {
                for (let l = 0; l < config.tamanho - 2; l++) {
                    let id = matrizGemas[l][c];
                    if (id !== -1 && id === matrizGemas[l+1][c] && id === matrizGemas[l+2][c]) {
                        paraEliminar[l][c] = paraEliminar[l+1][c] = paraEliminar[l+2][c] = true;
                        encontrou = true;
                    }
                }
            }
            if (encontrou) {
                for (let l = 0; l < config.tamanho; l++) {
                    for (let c = 0; c < config.tamanho; c++) {
                        if (paraEliminar[l][c]) { pontuacao += 10; matrizGemas[l][c] = -1; }
                    }
                }
            }
            return encontrou;
        }
        function processarTurno() {
            aplicarGravidade(); renderizarTabuleiro();
            setTimeout(() => {
                if (checarMatches()) processarTurno();
                else {
                    atualizarInterface();
                    if (pontuacao >= CONFIG_NIVEIS[nivelIdx].meta) fimDeJogo(true);
                    else bloqueado = false;
                }
            }, 400);
        }
        function aplicarGravidade() {
            const config = CONFIG_NIVEIS[nivelIdx];
            for (let c = 0; c < config.tamanho; c++) {
                let vazio = config.tamanho - 1;
                for (let l = config.tamanho - 1; l >= 0; l--) {
                    if (matrizGemas[l][c] !== -1) {
                        matrizGemas[vazio][c] = matrizGemas[l][c];
                        if (vazio !== l) matrizGemas[l][c] = -1;
                        vazio--;
                    }
                }
                for (let l = vazio; l >= 0; l--) matrizGemas[l][c] = Math.floor(Math.random() * config.tipos);
            }
        }
        function atualizarInterface() {
            const t = TEXTOS[idiomaAtual]; const config = CONFIG_NIVEIS[nivelIdx];
            document.getElementById('status-fase').innerText = `${t.statusNivel} ${config.nivel}`;
            document.getElementById('pontos-atual').innerText = pontuacao;
            document.getElementById('pontos-meta').innerText = config.meta;
            document.getElementById('status-vidas').innerText = `${t.statusVidas}: ${vidas}`;
        }
        function tratarTeclado(e, l, c) {
            const config = CONFIG_NIVEIS[nivelIdx];
            let nl = l, nc = c;
            if (e.key === "ArrowUp") nl--;
            else if (e.key === "ArrowDown") nl++;
            else if (e.key === "ArrowLeft") nc--;
            else if (e.key === "ArrowRight") nc++;
            else if (e.key === "Enter" || e.key === " ") { clicarGema(l, c); return; }
            else return;
            if (nl >= 0 && nl < config.tamanho && nc >= 0 && nc < config.tamanho) {
                coordFocada = { l: nl, c: nc };
                renderizarTabuleiro();
                document.getElementById(`gema-${nl}-${nc}`).focus();
            }
            e.preventDefault();
        }
        function tocarSom(f) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.value = f; gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        }
        function tocarErro() { tocarSom(100); }
        function anunciarTexto(txt) { const an = document.getElementById('anunciador-braille'); an.innerText = txt; }
        function voltarAoMenu() { jogoAtivo = false; document.getElementById('container-jogo').style.display = 'none'; document.getElementById('tela-inicial').style.display = 'flex'; }
        function fimDeJogo(vitoria) {
            jogoAtivo = false; document.getElementById('container-jogo').style.display = 'none';
            if (vitoria) document.getElementById('tela-vitoria').style.display = 'flex';
            else document.getElementById('tela-gameover').style.display = 'flex';
        }
        document.getElementById('btn-comecar').onclick = iniciarPartida;
        document.getElementById('bt-abrir-ajuda').onclick = () => document.getElementById('modal-ajuda').style.display='flex';
        document.getElementById('btn-abandonar').onclick = voltarAoMenu;
        document.getElementById('btn-proximo-nivel').onclick = () => { nivelIdx++; iniciarPartida(); };
    </script>
</body>
</html>
