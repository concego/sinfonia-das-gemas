<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinfonia das Gemas | Gems Symphony</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#bb86fc">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos rápidos para transição, depois movemos para style.css */
        body { background-color: #121212; color: #fff; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; }
        #app-container { width: 100%; max-width: 500px; padding: 20px; text-align: center; }
        .hidden { display: none; }
        table { border-collapse: collapse; margin: 20px auto; background: #1e1e1e; border: 2px solid #333; }
        td { width: 60px; height: 60px; border: 1px solid #333; cursor: pointer; position: relative; }
        .cristal { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-weight: bold; border-radius: 4px; }
        .gema-opaca { opacity: 0.5; }
        .selecionada { outline: 4px solid #00ffcc; z-index: 10; }
        .btn-acao { background: #bb86fc; color: #000; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; margin: 5px; }
    </style>
</head>
<body>
    <div id="app-container">
        <!-- Tela de Menu -->
        <div id="tela-menu">
            <h1 id="titulo-jogo">Sinfonia das Gemas</h1>
            <p id="subtitulo-jogo">Eu Concego Jogar 🐉</p>
            <div id="menu-opcoes">
                <!-- Injetado via JS -->
            </div>
            <button id="btn-iniciar" class="btn-acao">JOGAR / PLAY</button>
            <button id="btn-pass" class="btn-acao">PASSWORD</button>
        </div>

        <!-- Tela de Jogo -->
        <div id="tela-jogo" class="hidden">
            <div id="painel-status">
                <span id="label-score">Pontos: 0</span> | 
                <span id="label-vidas">Vidas: 3</span>
            </div>
            <div id="container-tabuleiro">
                <!-- Tabela gerada via JS -->
            </div>
            <button id="btn-voltar" class="btn-acao">Menu</button>
        </div>
    </div>

    <!-- Scripts Modulares -->
    <script type="module" src="src/js/app.js"></script>
    <script>
        // Registro do Service Worker para PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log("PWA: Ativo"))
                .catch(err => console.error("PWA: Erro", err));
        }
    </script>
</body>
</html>
